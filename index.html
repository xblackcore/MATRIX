<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome.</title>
    <style>
        html, body{
            margin    :0      ;
            width     :100%   ;
            height    :100%   ;
            overflow  :hidden ;
            background:#000000;
            color     :#ffffff;
        }
        #Loader{
            position       :fixed       ;
            inset          :0           ;
            display        :flex        ;
            justify-content:center      ;
            align-items    :center      ;
            background     :#000      ;
            z-index        :99999       ;
            transition     :opacity .35s;
        }
        .Circle{
            width           :70px                    ;
            height          :70px                    ;
            border-radius   :50%                     ;
            border          :4px solid #222          ;
            border-top-color:#00ffff                 ;
            animation       :Spin .8s linear infinite;
        }
        @keyframes Spin{
            from{
                transform:rotate(0deg);
            }
            to{
                transform:rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div id="Loader">
        <div class="Circle"></div>
    </div>
    <script>
        (async()=>{
            try{
                const response = await fetch("CODEX.html");
                const html = await response.text();
                document.open();
                document.write(html);
                document.close();
            }
            catch(e){
                document.body.innerHTML =
                "<h1 style='color:white;text-align:center;margin-top:100px;'>Error loading CODEX.html</h1>";
            }
        })();
    </script>
</body>
</html>
